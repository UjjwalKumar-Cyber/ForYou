services:
  - type: web
    name: foryou
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foryou-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MESSAGE_PAGE_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCOUNT_USERS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ANALYTICS_RETENTION_DAYS
        value: "45"

databases:
  - name: foryou-db
    plan: free
    databaseName: foryou
    user: foryou
    ipAllowList: []
