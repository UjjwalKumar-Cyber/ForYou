services:
  - type: web
    name: foryou
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: foryou-messages
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: MESSAGE_PAGE_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
