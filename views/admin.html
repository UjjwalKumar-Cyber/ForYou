<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>ForyoU Admin</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260511-2">
  </head>
  <body>
    <main class="page-shell admin-shell">
      <section class="card admin-login-card" id="admin-login-panel" aria-labelledby="admin-login-title">
        <img class="seal" src="/assets/seal.svg" alt="" width="76" height="76">
        <p class="eyebrow">ForyoU Admin</p>
        <h1 id="admin-login-title">Private inbox</h1>
        <p class="soft-copy">Log in with the username and password made for your account.</p>

        <form class="stack" id="admin-login-form" novalidate>
          <input type="hidden" name="scope" value="account">

          <label class="field-label" for="admin-username">Username</label>
          <input
            class="text-input"
            id="admin-username"
            name="username"
            type="text"
            autocomplete="username"
            required
          >

          <label class="field-label" for="admin-password">Password</label>
          <input
            class="text-input"
            id="admin-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >

          <p class="form-message" id="admin-login-message" role="status" aria-live="polite"></p>

          <button class="button primary-button" type="submit">Open inbox</button>
        </form>
      </section>

      <section class="admin-panel is-hidden" id="messages-panel" aria-labelledby="messages-title">
        <div class="admin-header">
          <div>
            <p class="eyebrow">ForyoU Admin</p>
            <h1 id="messages-title">Your messages</h1>
            <p class="inbox-user" id="inbox-user"></p>
          </div>
          <div class="admin-actions">
            <button class="button secondary-button" id="refresh-button" type="button">Refresh</button>
            <button class="button secondary-button" id="logout-button" type="button">Logout</button>
          </div>
        </div>

        <p class="form-message" id="admin-status" role="status" aria-live="polite"></p>

        <form class="compose-panel" id="account-message-form" novalidate>
          <div class="compose-heading">
            <div>
              <p class="eyebrow">Send</p>
              <h2>Write a message</h2>
            </div>
          </div>

          <div class="stack">
            <label class="field-label" for="account-recipient">Send to</label>
            <select class="text-input select-input" id="account-recipient" name="recipientUsername" required>
              <option value="">Loading inboxes...</option>
            </select>

            <label class="field-label" for="account-message">Message</label>
            <textarea
              class="textarea compact-textarea"
              id="account-message"
              name="message"
              maxlength="500"
              rows="5"
              required
            ></textarea>

            <div class="form-row">
              <p class="form-message" id="account-message-status" role="status" aria-live="polite"></p>
              <p class="counter"><span id="account-character-count">0</span>/500</p>
            </div>

            <button class="button primary-button" type="submit">Send message</button>
          </div>
        </form>

        <div class="message-list" id="message-list"></div>
      </section>
    </main>

    <template id="message-template">
      <article class="message-card">
        <div class="message-card-header">
          <div>
            <p class="message-sender"></p>
            <time class="message-time"></time>
          </div>
          <button class="delete-button" type="button">Delete</button>
        </div>
        <p class="message-text"></p>
      </article>
    </template>

    <script src="/js/admin.js?v=20260511-2" defer></script>
  </body>
</html>
