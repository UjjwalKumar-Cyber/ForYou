<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>ForyoU</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260512-1">
  </head>
  <body>
    <main class="page-shell auth-shell">
      <section class="card auth-card" aria-labelledby="password-title">
        <img class="seal" src="/assets/seal.svg" alt="" width="76" height="76">
        <p class="eyebrow">ForyoU</p>
        <h1 id="password-title">Only the right heart opens this.</h1>
        <p class="soft-copy">A quiet little room for words meant for one person.</p>

        <form class="stack" id="secret-login-form" novalidate>
          <input type="hidden" name="scope" value="secret">

          <label class="field-label" for="secret-password">Password</label>
          <input
            class="text-input"
            id="secret-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >

          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>

          <button class="button primary-button" type="submit">Unlock</button>
        </form>
      </section>
    </main>

    <script src="/js/secret-login.js?v=20260512-1" defer></script>
  </body>
</html>
