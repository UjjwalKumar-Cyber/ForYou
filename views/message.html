<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2b1b25">
    <title>ForyoU Secret Note</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preload" href="/assets/seal.svg" as="image" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css?v=20260512-8">
  </head>
  <body>
    <main class="page-shell message-shell">
      <section class="card note-card" aria-labelledby="message-title">
        <div class="card-topline">
          <img class="mini-seal" src="/assets/seal.svg" alt="" width="44" height="44" decoding="async">
          <p class="eyebrow">ForyoU</p>
        </div>

        <h1 id="message-title">Leave what your heart keeps replaying.</h1>
        <p class="soft-copy">Say it softly, and let it arrive.</p>

        <form class="stack" id="message-form" novalidate>
          <label class="field-label" for="sender-name">Your name</label>
          <input
            class="text-input"
            id="sender-name"
            name="senderName"
            type="text"
            maxlength="60"
            autocomplete="name"
            required
          >

          <label class="field-label" for="recipient">Send to</label>
          <select class="text-input select-input" id="recipient" name="recipientUsername" required>
            <option value="">Loading inboxes...</option>
          </select>

          <label class="field-label" for="message">Message</label>
          <textarea
            class="textarea"
            id="message"
            name="message"
            maxlength="500"
            rows="8"
          ></textarea>

          <label class="field-label" for="message-gallery-image">Media</label>
          <div class="photo-actions">
            <input
              class="visually-hidden"
              id="message-gallery-image"
              type="file"
              accept="image/*,video/*,audio/*,.pdf,.txt"
            >
            <label class="photo-action" for="message-gallery-image">Choose file</label>
            <input
              class="visually-hidden"
              id="message-camera-image"
              type="file"
              accept="image/*"
              capture="environment"
            >
            <label class="photo-action primary-photo-action" for="message-camera-image">Click photo</label>
            <button class="clear-file-button" id="clear-message-image" type="button">Clear</button>
          </div>
          <p class="file-hint" id="message-image-name">Optional photo, video, audio, file, or camera capture, up to 8 MB.</p>

          <div class="form-row">
            <p class="form-message" id="message-status" role="status" aria-live="polite"></p>
            <p class="counter"><span id="character-count">0</span>/500</p>
          </div>

          <button class="button primary-button" type="submit">Send message</button>
        </form>
      </section>
    </main>

    <script src="/js/message.js?v=20260512-8" defer></script>
  </body>
</html>
